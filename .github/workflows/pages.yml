name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional: a browser key restricted to https://asturksever.github.io/* in Google Cloud Console.
      # With the secret, visitors get Google Photorealistic 3D Tiles; without it, the open map (no key).
      # The key ends up in the public config.js, so the referrer and API restrictions are what protect it.
      - name: Inject public Maps key
        env:
          KEY: ${{ secrets.GMAPS_PUBLIC_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf "window.PUBLIC_MAPS_KEY = '%s';\n" "$KEY" > web/config.js
            echo "Public key injected into config.js"
          else
            echo "No GMAPS_PUBLIC_KEY secret: visitors get the open map"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
